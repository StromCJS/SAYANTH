  <path d="M30 99l4.4-4.4 4.4 4.4-4.4 4.4Z" fill="#c8921f"/>
  <text class="cf" x="46" y="103" font-size="12.5" fill="#cdc0a1">Repos with source</text>
  <text class="cm" x="286" y="103" font-size="13.5" font-weight="700" text-anchor="end"
