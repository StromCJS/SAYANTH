<circle cx="372" cy="118" r="42" fill="none" stroke="url(#Cacc)" stroke-width="8"
        stroke-linecap="round" pathLength="100" stroke-dasharray="100"
        stroke-dashoffset="100" filter="url(#Cglow)" transform="rotate(-90 372 118)">
  <animate attributeName="stroke-dashoffset" values="100;35" dur="1.5s" begin=".5s"
           calcMode="spline" keySplines=".2 .8 .25 1" fill="freeze"/></circle>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1.1s" fill="freeze"/>
  <text class="cm" x="372" y="122" font-size="27" font-weight="800" text-anchor="middle"
        fill="#f8f2e3">17</text>
  <text class="cf" x="372" y="138" font-size="8.5" letter-spacing="1.8"
        text-anchor="middle" fill="#9b8c68">REPOS</text></g>
<text class="cf" x="372" y="182" font-size="9.5" text-anchor="middle"
      fill="#cdc0a1">65% hold source</text>
<g class="csh"><rect x="-60" y="0" width="90" height="210" fill="url(#Cshine)"
   transform="skewX(-20)"/></g>
</g></svg>