  <path d="M30 124l4.4-4.4 4.4 4.4-4.4 4.4Z" fill="#c8921f"/>
  <text class="cf" x="46" y="128" font-size="12.5" fill="#cdc0a1">Stars earned</text>
  <text class="cm" x="286" y="128" font-size="13.5" font-weight="700" text-anchor="end"
        fill="#f5c542">1</text></g><g opacity="0">
  <animate attributeName="opacity" values="0;1" dur=".45s" begin="0.68s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="-30,0;0,0"
      dur=".6s" begin="0.68s" calcMode="spline" keySplines=".2 .8 .3 1" fill="freeze"/>
  <path d="M30 149l4.4-4.4 4.4 4.4-4.4 4.4Z" fill="#c8921f"/>
  <text class="cf" x="46" y="153" font-size="12.5" fill="#cdc0a1">Languages in use</text>
  <text class="cm" x="286" y="153" font-size="13.5" font-weight="700" text-anchor="end"
        fill="#f5c542">4</text></g><g opacity="0">
  <animate attributeName="opacity" values="0;1" dur=".45s" begin="0.79s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="-30,0;0,0"
      dur=".6s" begin="0.79s" calcMode="spline" keySplines=".2 .8 .3 1" fill="freeze"/>
  <path d="M30 174l4.4-4.4 4.4 4.4-4.4 4.4Z" fill="#c8921f"/>
  <text class="cf" x="46" y="178" font-size="12.5" fill="#cdc0a1">Member since</text>
  <text class="cm" x="286" y="178" font-size="13.5" font-weight="700" text-anchor="end"
        fill="#f5c542">Oct 2024</text></g>
<circle cx="372" cy="118" r="42" fill="none" stroke="#ffffff" stroke-opacity=".10"
