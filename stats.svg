  <path d="M30 74l4.4-4.4 4.4 4.4-4.4 4.4Z" fill="#c8921f"/>
  <text class="cf" x="46" y="78" font-size="12.5" fill="#cdc0a1">Public repositories</text>
  <text class="cm" x="286" y="78" font-size="13.5" font-weight="700" text-anchor="end"
        fill="#f5c542">17</text></g><g opacity="0">
  <animate attributeName="opacity" values="0;1" dur=".45s" begin="0.46s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="-30,0;0,0"
