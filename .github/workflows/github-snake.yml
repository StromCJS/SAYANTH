name: Generate Snake Animation

# Builds a black-and-gold contribution snake from StromCJS's contribution graph
# and publishes it to the "output" branch, where the README reads it from.
#
# This repository is named "StromCJS", matching the username, which is what
# makes its README the profile README. Renaming it would break that.

on:
  schedule:
    # every day at 00:20 UTC
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate the snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # `|` keeps every character literal, so the #rrggbb colours survive YAML
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#8a6407&color_dots=#f6eed6,#e8d093,#d4a62c,#a87c14,#4a3600
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffd76a&color_dots=#15120b,#4a3600,#a87c14,#d4a62c,#ffe9a8
            dist/gold.gif?color_snake=#f5c542&color_dots=#0b0b0d,#3a2c08,#8a6a16,#d4a62c,#ffe9a8

      - name: Show what was generated
        run: ls -lh dist

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
